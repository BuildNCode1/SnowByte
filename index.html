<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SnowByte</title>
   <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>❄️</text></svg>">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #080c18;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: monospace;
      color: #90a0c0;
      overflow: hidden;
    }
    canvas {
      image-rendering:pixelated;
      image-rendering: crisp-edges;
      border: 4px solid #1e2a45;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
      width: 640px;
      height: 480px;
    }
    .caption {
      margin-top: 12px;
      font-size: 14px;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-shadow: 0 0 5px #406090;
    }
    button {
            margin-top: 16px;
            background-color: #1a2636;
            color: #f0f8ff;
            font-family: monospace;
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 1px;
            text-transform: uppercase;
            padding: 8px 16px;
            border: none;
            cursor: pointer;
            outline: none;

            box-shadow: 
                -4px 0 0 0 #3d527a,
                4px 0 0 0 #0d131d,
                0 -4px 0 0 #3d527a,
                0  4px 0 0 #0d131d,
                -4px -4px 0 0 #3d527a,
                4px -4px 0 0 #3d527a,
                -4px  4px 0 0 #0d131d,
                4px  4px 0 0 #0d131d;

            transition: none;
    }
    button:hover {
      background: #2a3b5c;
      color: #f0f8ff;
    }

    button:active {
    background-color: #121b27;
    transform: translate(2px, 2px);
    box-shadow: 
        -4px 0 0 0 #0d131d,
        4px 0 0 0 #3d527a,
        0 -4px 0 0 #0d131d,
        0  4px 0 0 #3d527a,
        -4px -4px 0 0 #0d131d,
        4px -4px 0 0 #0d131d,
        -4px  4px 0 0 #3d527a,
        4px  4px 0 0 #3d527a;
    }
  </style>
</head>
<body>

  <canvas id="demoCanvas" width="160" height="120"></canvas>
  <div class="caption">Winter Solstice</div>

  <audio id="bgMusic" src="./bgMusic.mp3" loop></audio>
  <button onclick="toggleMusic()">Play / Pause Music</button>

  <script>
    const canvas = document.getElementById('demoCanvas');
    const ctx = canvas.getContext('2d');

    const WIDTH = canvas.width;
    const HEIGHT = canvas.height;

    const PALETTE = {
      skyDark: '#080c18',
      skyMid: '#101a30',
      skyLight: '#1d2e4a',
      mountainFar: '#2a3b5c',
      mountainNear: '#3d527a',
      treeDark: '#0e242b',
      treeMid: '#183a40',
      treeLight: '#245258',
      snowDark: '#7898b0',
      snowMid: '#b0ccde',
      snowWhite: '#f0f8ff'
    };

    const generateForest = (count, minScale, maxScale) => {
      const trees = [];
      for (let i = 0; i < count; i++) {
        trees.push({
          x: Math.random() * (WIDTH + 60) - 30,
          scale: minScale + Math.random() * (maxScale - minScale),
          seed: Math.random()
        });
      }
      return trees.sort((a, b) => a.scale - b.scale);
    };

    const backgroundTrees = generateForest(25, 0.4, 0.6);
    const foregroundTrees = generateForest(18, 0.7, 1.1);

    const SNOW_COUNT = 60;
    const snowflakes = Array.from({ length: SNOW_COUNT }, () => ({
      x: Math.random() * WIDTH,
      y: Math.random() * HEIGHT,
      speed: 0.2 + Math.random() * 0.5,
      size: Math.random() > 0.8 ? 2 : 1,
      drift: Math.random() * 2
    }));

    let time = 0;

    function drawPixelTree(centerX, bottomY, scale, darkColor, lightColor) {
      const h = Math.floor(30 * scale);
      const w = Math.floor(18 * scale);

      ctx.fillStyle = '#140c1c';
      ctx.fillRect(Math.floor(centerX - 1), Math.floor(bottomY - 4 * scale), 2, Math.floor(4 * scale));

      const tiers = 3;
      for (let i = 0; i < tiers; i++) {
        const tierY = bottomY - (h * (i + 1)) / tiers;
        const tierWidth = w * (1 - i * 0.25);
        const tierHeight = (h / tiers) + 2;

        ctx.fillStyle = darkColor;
        ctx.beginPath();
        ctx.moveTo(Math.floor(centerX), Math.floor(tierY));
        ctx.lineTo(Math.floor(centerX - tierWidth / 2), Math.floor(tierY + tierHeight));
        ctx.lineTo(Math.floor(centerX + tierWidth / 2), Math.floor(tierY + tierHeight));
        ctx.fill();

        ctx.fillStyle = PALETTE.snowWhite;
        ctx.fillRect(
          Math.floor(centerX - tierWidth / 4),
          Math.floor(tierY + tierHeight * 0.3),
          Math.floor(tierWidth / 2),
          1
        );
      }
    }

    function render() {
      time += 0.02;
      const scrollX = Math.sin(time * 0.5) * 15;

      const skyGradient = ctx.createLinearGradient(0, 0, 0, HEIGHT);
      skyGradient.addColorStop(0, PALETTE.skyDark);
      skyGradient.addColorStop(0.6, PALETTE.skyMid);
      skyGradient.addColorStop(1, PALETTE.skyLight);
      ctx.fillStyle = skyGradient;
      ctx.fillRect(0, 0, WIDTH, HEIGHT);

      ctx.fillStyle = PALETTE.snowWhite;
      ctx.fillRect(120, 20, 8, 8);
      ctx.fillStyle = PALETTE.skyDark;
      ctx.fillRect(118, 18, 4, 4);

      ctx.fillStyle = PALETTE.mountainFar;
      ctx.beginPath();
      ctx.moveTo(-20, 80);
      ctx.lineTo(30 + scrollX * 0.1, 45);
      ctx.lineTo(90 + scrollX * 0.1, 75);
      ctx.lineTo(140 + scrollX * 0.1, 40);
      ctx.lineTo(WIDTH + 20, 85);
      ctx.lineTo(WIDTH + 20, HEIGHT);
      ctx.lineTo(-20, HEIGHT);
      ctx.fill();

      backgroundTrees.forEach(tree => {
        const x = (tree.x + scrollX * 0.3 + WIDTH + 30) % (WIDTH + 60) - 30;
        drawPixelTree(x, 85, tree.scale, PALETTE.treeDark, PALETTE.treeMid);
      });

      ctx.fillStyle = PALETTE.mountainNear;
      ctx.beginPath();
      ctx.moveTo(-10, 90);
      ctx.quadraticCurveTo(50 + scrollX * 0.4, 75, 100 + scrollX * 0.4, 92);
      ctx.quadraticCurveTo(140 + scrollX * 0.4, 85, WIDTH + 10, 95);
      ctx.lineTo(WIDTH + 10, HEIGHT);
      ctx.lineTo(-10, HEIGHT);
      ctx.fill();

      foregroundTrees.forEach(tree => {
        const x = (tree.x + scrollX * 0.8 + WIDTH + 30) % (WIDTH + 60) - 30;
        drawPixelTree(x, 108, tree.scale, PALETTE.treeMid, PALETTE.treeLight);
      });

      ctx.fillStyle = PALETTE.snowDark;
      ctx.fillRect(0, 106, WIDTH, HEIGHT - 106);
      ctx.fillStyle = PALETTE.snowMid;
      ctx.fillRect(0, 110, WIDTH, HEIGHT - 110);
      ctx.fillStyle = PALETTE.snowWhite;
      ctx.fillRect(0, 115, WIDTH, HEIGHT - 115);

      ctx.fillStyle = PALETTE.snowWhite;
      snowflakes.forEach(flake => {
        flake.y += flake.speed;
        flake.x += Math.sin(time + flake.drift) * 0.3;

        if (flake.y > HEIGHT) {
          flake.y = -2;
          flake.x = Math.random() * WIDTH;
        }

        ctx.fillRect(Math.floor(flake.x), Math.floor(flake.y), flake.size, flake.size);
      });

      ctx.fillStyle = 'rgba(8, 12, 24, 0.15)';
      for (let y = 0; y < HEIGHT; y += 2) {
        ctx.fillRect(0, y, WIDTH, 1);
      }

      requestAnimationFrame(render);
    }

    render();

    // Audio control handler
    const audio = document.getElementById('bgMusic');
    function toggleMusic() {
      if (audio.paused) {
        audio.play();
      } else {
        audio.pause();
      }
    }
  </script>
</body>
